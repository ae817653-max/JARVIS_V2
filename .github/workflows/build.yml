name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Pre-install licenses + build-tools 37
        run: |
          sudo apt update && sudo apt install -y zip unzip ant
          pip install Cython==0.29.33 buildozer
          SDK=~/.buildozer/android/platform/android-sdk
          SYS=/usr/local/lib/android/sdk
          mkdir -p $SDK ~/.android
          touch ~/.android/repositories.cfg
          # 1. Aceptar TODO en SDK del sistema
          yes | $SYS/cmdline-tools/latest/bin/sdkmanager --licenses || true
          # 2. Copiar cmdline-tools
          mkdir -p $SDK/cmdline-tools
          rm -rf $SDK/cmdline-tools/latest
          cp -r $SYS/cmdline-tools/latest $SDK/cmdline-tools/
          # 3. Copiar LICENCIAS REALES ya aceptadas (esto es lo que te faltaba)
          mkdir -p $SDK/licenses
          cp -r $SYS/licenses/* $SDK/licenses/ || true
          ls $SDK/licenses/
          # 4. Ahora sí instalar en el SDK de buildozer
          $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "build-tools;37.0.0" "platforms;android-34" "platform-tools" "ndk;25.1.8937393"
          ls $SDK/build-tools/37.0.0/
          $SDK/build-tools/37.0.0/aidl --version
      - name: Build APK
        run: |
          buildozer android debug --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
