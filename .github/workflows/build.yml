name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5 \
            libncurses6 \
            libtinfo5 \
            cmake

          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.33" buildozer

      - name: Prepare Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SYS="$ANDROID_HOME"

          mkdir -p "$SDK"
          mkdir -p "$SDK/cmdline-tools"

          # Copiar command-line tools
          if [ -d "$SYS/cmdline-tools/latest" ]; then
            rm -rf "$SDK/cmdline-tools/latest"
            cp -r "$SYS/cmdline-tools/latest" "$SDK/cmdline-tools/latest"
          fi

          # Compatibilidad con Buildozer:
          # Buildozer busca sdkmanager en tools/bin/sdkmanager
          mkdir -p "$SDK/tools"

          rm -rf "$SDK/tools/bin"

          ln -s \
            "$SDK/cmdline-tools/latest/bin" \
            "$SDK/tools/bin"

          chmod +x "$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "Comprobando sdkmanager..."

          "$SDK/tools/bin/sdkmanager" --version

          echo "sdkmanager encontrado correctamente"

          # Aceptar licencias
          yes | "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses || true

          # Instalar herramientas necesarias
          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK preparado correctamente"

      - name: Build APK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          # Asegurar que Buildozer encuentre sdkmanager
          mkdir -p "$SDK/tools"

          if [ ! -e "$SDK/tools/bin" ]; then
            ln -s "$SDK/cmdline-tools/latest/bin" "$SDK/tools/bin"
          fi

          echo "Verificando sdkmanager:"
          "$SDK/tools/bin/sdkmanager" --version

          echo "Iniciando Buildozer..."
          buildozer android debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
