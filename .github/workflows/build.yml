name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Pre-install licenses + build-tools 37 for BUILDOZER SDK
        run: |
          sudo apt update && sudo apt install -y zip unzip ant
          pip install Cython==0.29.33 buildozer
          SDK=~/.buildozer/android/platform/android-sdk
          SYS=/usr/local/lib/android/sdk
          mkdir -p $SDK/cmdline-tools
          cp -r $SYS/cmdline-tools/latest $SDK/cmdline-tools/
          mkdir -p $SDK/licenses ~/.android
          touch ~/.android/repositories.cfg
          # Licencias conocidas de Google (aceptan todo)
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea8b1e4" >> $SDK/licenses/android-sdk-license
          echo "y" | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK --licenses
          $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "build-tools;37.0.0" "platforms;android-34" "platform-tools" "ndk;25.1.8937393"
          ls $SDK/build-tools/37.0.0/aidl
          $SDK/build-tools/37.0.0/aidl --version
      - name: Build APK
        run: |
          buildozer android debug --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
