name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build
        run: |
          sudo apt update && sudo apt install -y zip unzip ant
          pip install Cython==0.29.33 buildozer
          # Truco: pre-aceptar licencia en TODOS lados
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;37.0.0" "platforms;android-34" "ndk;25.1.8937393"
          # Copiar licencia al SDK de buildozer para que no diga "not accepted"
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          cp -r /usr/local/lib/android/sdk/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ || true
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/
          cp -r /usr/local/lib/android/sdk/build-tools/37.0.0 ~/.buildozer/android/platform/android-sdk/build-tools/ || true
          buildozer android debug --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
