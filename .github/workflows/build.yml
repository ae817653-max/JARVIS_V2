name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Fix sdkmanager path
        run: |
          sudo apt update && sudo apt install -y zip unzip ant
          pip install Cython==0.29.33 buildozer
          # 1. Instalar todo en SDK del sistema
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;37.0.0" "platforms;android-34" "platform-tools" "ndk;25.1.8937393"
          # 2. CREAR el sdkmanager viejo que buildozer busca y no existe
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
          cp -r /usr/local/lib/android/sdk/cmdline-tools/latest/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
          ls -l ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --version
      - name: Build APK
        run: |
          buildozer android debug --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
