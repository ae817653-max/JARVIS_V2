from kivy.app import App
from kivy.uix.boxlayout import BoxLayout
from kivy.uix.label import Label
from kivy.uix.button import Button


class JarvisApp(App):

    def build(self):
        layout = BoxLayout(
            orientation="vertical",
            padding=24,
            spacing=16
        )

        title = Label(
            text="JARVIS",
            font_size="34sp",
            size_hint_y=None,
            height=70
        )

        status = Label(
            text="Sistema listo",
            font_size="20sp"
        )

        button = Button(
            text="INICIAR JARVIS",
            size_hint_y=None,
            height=64
        )

        def iniciar_jarvis(instance):
            status.text = "JARVIS iniciado correctamente"

        button.bind(on_release=iniciar_jarvis)

        layout.add_widget(title)
        layout.add_widget(status)
        layout.add_widget(button)

        return layout


if __name__ == "__main__":
    JarvisApp().run()
